services:
  postgres:
    image: postgres:16
    container_name: erp-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - erp_local_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage standing in for the documents bucket
  # (infra/storage.tf) so Document Control can be run locally with no AWS
  # account. StorageService points at this via S3_ENDPOINT when
  # AUTH_MODE=local (see backend/.env.local.example) and creates the bucket
  # itself on first boot.
  minio:
    image: minio/minio:latest
    container_name: erp-local-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - erp_local_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending Prisma migrations and upserts the seed roles,
  # then exits. Uses the `build` stage (has the Prisma CLI + ts-node as
  # devDependencies) rather than the lean `runtime` image the backend
  # service runs from.
  migrate:
    build:
      context: ./backend
      target: build
    container_name: erp-local-migrate
    environment:
      DATABASE_URL: postgresql://erp_admin:local_dev_password@postgres:5432/erp
    command: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy

  # The same image `infra/ecs.tf` deploys to AWS (see backend/Dockerfile's
  # `runtime` stage) — running it here validates the actual deployable
  # artifact, not just the dev server.
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: erp-local-backend
    restart: unless-stopped
    environment:
      AUTH_MODE: local
      DATABASE_URL: postgresql://erp_admin:local_dev_password@postgres:5432/erp
      PORT: 3000
      AWS_REGION: us-east-1
      COGNITO_USER_POOL_ID: unused-in-local-mode
      COGNITO_CLIENT_ID: unused-in-local-mode
      DOCUMENTS_BUCKET: erp-local-documents
      # S3_ENDPOINT is the container-to-container address the backend uses
      # to talk to MinIO directly; S3_PUBLIC_ENDPOINT is what gets baked
      # into presigned download URLs, which a browser on the host requests
      # instead — "minio" isn't resolvable there, but this maps to the same
      # container via the "9000:9000" port publish below.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  erp_local_pg_data:
  erp_local_minio_data:
