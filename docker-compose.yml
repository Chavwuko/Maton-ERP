services:
  postgres:
    image: postgres:16
    container_name: erp-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - erp_local_pg_data:/var/lib/postgresql/data

  # S3-compatible storage standing in for the documents bucket
  # (infra/storage.tf) so Document Control can be run locally with no AWS
  # account. StorageService points at this via S3_ENDPOINT when
  # AUTH_MODE=local (see backend/.env.local.example) and creates the bucket
  # itself on first boot.
  minio:
    image: minio/minio:latest
    container_name: erp-local-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - erp_local_minio_data:/data

volumes:
  erp_local_pg_data:
  erp_local_minio_data:
