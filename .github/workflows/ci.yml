name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: backend/coverage
          retention-days: 14

  e2e-tests:
    name: e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_admin
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_admin -d erp"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      AUTH_MODE: local
      DATABASE_URL: postgresql://erp_admin:local_dev_password@localhost:5432/erp
      PORT: 3000
      AWS_REGION: us-east-1
      COGNITO_USER_POOL_ID: unused-in-local-mode
      COGNITO_CLIENT_ID: unused-in-local-mode
      DOCUMENTS_BUCKET: erp-local-documents
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # GitHub Actions' native `services:` block can't override a service
      # image's command/args, and MinIO needs `server /data --console-address
      # ":9001"` — so it's started as a plain container step instead, using
      # the same `mc ready local` healthcheck as docker-compose.yml.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 30); do
            docker exec minio mc ready local && break
            sleep 1
          done

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: e2e tests
        run: npm run test:e2e
